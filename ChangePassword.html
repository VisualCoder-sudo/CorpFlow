<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <link rel="icon" href="NEWCorpFlowLogo.png">
    <style>
        body {
            background-color: rgb(29, 29, 29);
        }

        .TopHeader {
            color: white;
            font-family: var(--font-display);
            font-size: 24px;
            margin-top: 40px;
            text-align: center;
            font-family: Arial;
        }

        #new-password-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 24px;
        }

        .Password-Text {
            padding: 12px;
            width: 300px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-shadow: 3px 3px 3px black;
        }

        .Submit-btn {
            padding: 12px 24px;
            background-color: lightgreen;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        .Submit-btn:hover {
            background-color: rgb(186, 255, 186);
        }

        .StatusTXT {
            color: rgb(255, 0, 0);
            font-size: 14px;
            margin-top: 12px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <h2 class="TopHeader">Set your new password</h2>
    <form id="new-password-form">
        <input type="password" id="new-password" placeholder="Enter new password" class="Password-Text" required>
        <button type="submit" class="Submit-btn">Update Password</button>
        <p id="status" class="StatusTXT"></p>
    </form>
    

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJ-ijFfP4SKoFtn29jhM2vUGA5CYJjq00",
            authDomain: "corpflowdb-44f5b.firebaseapp.com",
            projectId: "corpflowdb-44f5b",
            storageBucket: "corpflowdb-44f5b.firebasestorage.app",
            messagingSenderId: "456144403684",
            appId: "1:456144403684:web:5c729f88ef74b7bb1380f1",
            measurementId: "G-28C03PCEC4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        const form = document.getElementById('new-password-form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            try {
                await confirmPasswordReset(auth, actionCode, newPassword);
                status.textContent = "Password updated successfully! You can now sign in.";
                status.style.color = "white";
                setTimeout(() => {status.textContent = "Redirecting to login page";}, 1500);
                setTimeout(() => {window.location.href = 'auth.html';}, 2000);
            } catch (error) {
                status.textContent = "Error Updating Password";
            }
        });
    </script>
</body>
</html>
